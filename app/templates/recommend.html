{% extends "base.html" %}
{% block title %} - Find properties{% endblock %}
{% block content %}
<div class="pagehead"><h1>Find properties</h1><p>Tell us what you need. Each match explains why it fits.</p></div>
<form id="f" class="panel filters">
  <label>Location<select name="location"><option>Any</option>{% for l in locations %}<option>{{ l }}</option>{% endfor %}</select></label>
  <label>Max budget ($)<input type="number" name="budget" value="250000" min="10000" step="5000" required></label>
  <label>Bedrooms<select name="bedrooms"><option value="0">Any</option>{% for n in range(1,7) %}<option value="{{ n }}">{{ n }}+</option>{% endfor %}</select></label>
  <label>Property type<select name="property_type"><option>Any</option>{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></label>
  <label class="check"><input type="checkbox" name="need_parking"> Parking</label>
  <label class="check"><input type="checkbox" name="need_garden"> Garden</label>
  <button class="btn accent">Search</button>
</form>
<div id="count" class="muted"></div>
<div id="out" class="listings" aria-live="polite"></div>
{% endblock %}
{% block script %}
<script>
const f = document.getElementById("f"), out = document.getElementById("out"), count = document.getElementById("count");
const I = {
  bed:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/></svg>',
  bath:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM6 12V6a2 2 0 0 1 4 0"/></svg>',
  area:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};
const HOUSE = '<svg class="house" viewBox="0 0 120 80" aria-hidden="true"><path d="M10 78V38L60 8l50 30v40z" fill="rgba(255,255,255,.22)"/><path d="M0 78h120" stroke="rgba(255,255,255,.5)" stroke-width="2"/><rect x="50" y="48" width="20" height="30" fill="rgba(255,255,255,.5)"/><rect x="22" y="44" width="16" height="14" fill="rgba(255,255,255,.4)"/><rect x="82" y="44" width="16" height="14" fill="rgba(255,255,255,.4)"/></svg>';

async function search() {
  const fd = new FormData(f);
  const body = {budget:Number(fd.get("budget")), location:fd.get("location"), bedrooms:Number(fd.get("bedrooms")),
    property_type:fd.get("property_type"), need_parking:fd.has("need_parking"), need_garden:fd.has("need_garden")};
  out.innerHTML = '<p class="muted">Searching…</p>'; count.textContent = "";
  const r = await fetch("/api/recommend", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const {results} = await r.json();
  if (!results.length) { out.innerHTML = '<p class="panel">No properties match. Try raising your budget or relaxing a filter.</p>'; return; }
  count.textContent = `Top ${results.length} matches`;
  out.innerHTML = results.map((p, i) => `<article class="listing">
    <div class="photo tone${i % 3}">${HOUSE}<span class="tag">${p.property_type}</span>${p.age_years <= 10 ? '<span class="tag new">Newer build</span>' : ""}<span class="score">${p.score}% match</span></div>
    <div class="lbody">
      <p class="price">$${p.price.toLocaleString()}</p>
      <p class="loc">${p.property_type} in ${p.location}</p>
      <ul class="specs"><li>${I.bed} ${p.bedrooms} bed</li><li>${I.bath} ${p.bathrooms} bath</li><li>${I.area} ${p.area_sqft.toLocaleString()} sq ft</li></ul>
      <p class="muted small">${p.age_years} years old${p.garden ? " · Garden" : ""}${p.parking ? " · " + p.parking + " parking" : ""}</p>
      <div class="why"><h3>Why it matches</h3><ul>${p.why.map(w => `<li>${w}</li>`).join("")}</ul></div>
    </div></article>`).join("");
}
f.addEventListener("submit", e => { e.preventDefault(); search(); });
const q = new URLSearchParams(location.search);
if ([...q.keys()].length) { for (const [k, v] of q) { const el = f.elements[k]; if (el) el.value = v; } search(); }
</script>
{% endblock %}
